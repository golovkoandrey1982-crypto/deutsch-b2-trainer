function mischen(liste) {
    var kopie = liste.slice();
    for (var i = kopie.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = kopie[i];
        kopie[i] = kopie[j];
        kopie[j] = temp;
    }
    return kopie;
}

        "<button class='menuButton' onclick=\"startKategorie('Antwort auf Beschwerde')\">4. Antwort auf Beschwerde</button>" +
        "<button class='menuButton' onclick=\"startKategorie('Forumsbeitrag')\">5. Forumsbeitrag</button>" +
        "<button class='menuButton' onclick=\"startGemischt()\">6. Gemischtes Training</button>";
}

function startKategorie(name) {
    aktuellerTitel = name;
    alleFragen = mischen(daten[name]);
    index = 0;
    punkte = 0;
    zeigeFrage();
}

function startGemischt() {
    aktuellerTitel = "Gemischtes Training";
    var gemischt = [];
    for (var kategorie in daten) {
        gemischt = gemischt.concat(daten[kategorie]);
    }
    alleFragen = mischen(gemischt);
    index = 0;
    punkte = 0;
    zeigeFrage();
}

function zeigeFrage() {
    beantwortet = false;
    var f = alleFragen[index];
    var antworten = mischen(f.antworten);

    var html =
        "<h1>Deutsch-B2-Trainer</h1>" +
        "<p class='klein'>" + aktuellerTitel + "</p>" +
        "<div class='info'>Punkte: <span id='punkte'>" + punkte + "</span> | Frage: " + (index + 1) + "/" + alleFragen.length + "</div>" +
        "<div class='frage'>" + f.frage + "</div>" +
        "<div id='antworten'></div>" +
        "<div class='meldung' id='meldung' style='display:none;'></div>" +
        "<button onclick='weiter()' id='weiterButton' style='display:none;'>Weiter</button>" +
        "<button class='zurueck' onclick='zeigeMenu()'>Zurück zum Menü</button>";

    document.getElementById("box").innerHTML = html;

    var div = document.getElementById("antworten");
    for (var i = 0; i < antworten.length; i++) {
        var b = document.createElement("button");
        b.innerText = antworten[i];
        b.onclick = function() {
            pruefen(this);
        };
        div.appendChild(b);
    }
}

function findeInfo(antwort) {
    if (info[antwort]) {
        return info[antwort];
    }
    return "Diese Antwort passt hier nicht so gut. Achte auf die typische Verbindung und den Kontext.";
}

    var gewaehlteAntwort = button.innerText;
    var alleButtons = document.querySelectorAll("#antworten button");

    for (var i = 0; i < alleButtons.length; i++) {
        if (alleButtons[i].innerText === richtigeAntwort) {
            alleButtons[i].className = "richtig";
        }
    }

    var meldung = document.getElementById("meldung");
    meldung.style.display = "block";

    if (gewaehlteAntwort === richtigeAntwort) {
        punkte++;
        meldung.innerHTML =
            "<b>Richtig!</b><br><br>" +
            f.erklaerung;
    } else {
        button.className = "falsch";
        meldung.innerHTML =
            "<b>Nicht richtig.</b><br><br>" +
            "<b>Warum?</b><br>" +
            f.erklaerung + "<br><br>" +
            "<b>Deine Antwort war:</b> " + gewaehlteAntwort + "<br>" +
            findeInfo(gewaehlteAntwort) + "<br><br>" +
            "<b>Merke:</b> Richtig ist: <b>" + richtigeAntwort + "</b>.";
    }

    document.getElementById("weiterButton").style.display = "block";
}

function weiter() {
    index++;
    if (index >= alleFragen.length) {
        document.getElementById("box").innerHTML =
            "<h1>Fertig!</h1>" +
            "<p class='klein'>" + aktuellerTitel + "</p>" +
            "<div class='frage'>Du hast " + punkte + " von " + alleFragen.length + " Punkten erreicht.</div>" +
            "<button onclick='startKategorie(aktuellerTitel)'>Noch einmal diese Kategorie spielen</button>" +
            "<button onclick='zeigeMenu()'>Zurück zum Menü</button>";
    } else {
        zeigeFrage();
    }
}

zeigeMenu();
</script>

</body>
</html>
