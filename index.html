<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Deutsch-B2-Trainer</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}
.box {
    max-width: 780px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
}
h1 {
    text-align: center;
}
.klein {
    text-align: center;
    color: #555;
}
.frage {
    font-size: 25px;
    margin: 25px 0;
    text-align: center;
    font-weight: bold;
}
button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #e8e8e8;
    cursor: pointer;
}
button:hover {
    background: #d5d5d5;
}
.menuButton {
    background: #eef2ff;
    text-align: left;
}
.richtig {
    background: #c8f7c5 !important;
}
.falsch {
    background: #ffc9c9 !important;
}
.info {
    margin-top: 20px;
    font-size: 18px;
    text-align: center;
}
.meldung {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.5;
    background: #f7f7f7;
    padding: 15px;
    border-radius: 12px;
}
.zurueck {
    background: #ddd;
    font-size: 17px;
}
</style>
</head>
<body>

<div class="box" id="box"></div>

<script>
var alleFragen = [];
var index = 0;
var punkte = 0;
var beantwortet = false;
var aktuellerTitel = "";

var info = {
    "begleichen": "„begleichen“ passt zu: eine Rechnung begleichen, eine Schuld begleichen, einen offenen Betrag begleichen. Bedeutung: bezahlen.",
    "abhalten": "„abhalten“ passt zu: eine Besprechung abhalten, eine Sitzung abhalten, ein Meeting abhalten.",
    "erteilen": "„erteilen“ passt zu: einen Auftrag erteilen, eine Genehmigung erteilen, eine Erlaubnis erteilen.",
    "beheben": "„beheben“ passt zu: einen Fehler beheben, einen Mangel beheben, ein Problem beheben.",
    "feststellen": "„feststellen“ passt zu: einen Fehler feststellen, einen Mangel feststellen. Bedeutung: erkennen, dass etwas so ist.",
    "einholen": "„einholen“ passt zu: ein Angebot einholen, Informationen einholen, eine Auskunft einholen.",
    "entgegennehmen": "„entgegennehmen“ passt zu: eine Lieferung entgegennehmen, eine Beschwerde entgegennehmen, einen Anruf entgegennehmen.",
    "aufgeben": "„aufgeben“ passt zu: eine Bestellung aufgeben, eine Anzeige aufgeben, ein Paket aufgeben.",
    "vereinbaren": "„vereinbaren“ passt zu: einen Termin vereinbaren, einen Preis vereinbaren, ein Treffen vereinbaren.",
    "verschieben": "„verschieben“ passt zu: einen Termin verschieben, eine Besprechung verschieben.",
    "absagen": "„absagen“ passt zu: einen Termin absagen, ein Treffen absagen.",
    "einladen": "„einladen“ passt zu Personen: jemanden einladen, Gäste einladen, Kolleginnen und Kollegen einladen.",
    "nähen": "„nähen“ passt zu: Kleidung nähen, Stoff nähen, einen Knopf annähen. Bei Maschinen passt es nicht.",
    "erforderlich": "„erforderlich“ bedeutet: notwendig.",
    "veraltet": "„veraltet“ bedeutet: alt und nicht mehr aktuell.",
    "die Neuorientierung": "„die Neuorientierung“ bedeutet: eine neue Richtung, zum Beispiel beruflich.",
    "die Besprechung": "„die Besprechung“ bedeutet: ein berufliches Gespräch oder Meeting.",
    "die Herausforderung": "„die Herausforderung“ bedeutet: eine schwierige Aufgabe, die man lösen muss.",
    "sorgfältig": "„sorgfältig“ bedeutet: genau, ordentlich und mit viel Aufmerksamkeit.",
    "Vielen Dank für Ihre Nachricht.": "Das passt gut als höfliche Einleitung in einer Antwort auf eine Beschwerde.",

    "Ich bitte Sie, die fehlenden Artikel schnellstmöglich nachzuliefern.": "Das ist eine höfliche Forderung in einer Beschwerde.",
    "Ich habe ähnliche Erfahrungen gemacht.": "Das passt gut in einen Forumsbeitrag, weil es persönlich und natürlich klingt.",
    "Meiner Meinung nach": "„Meiner Meinung nach“ passt gut, wenn man in einem Forumsbeitrag die eigene Meinung äußert."

var daten = {
    "Wortschatz": [
        {
            frage: "Was bedeutet „erforderlich“?",
            richtig: "notwendig",

            erklaerung: "„erforderlich“ bedeutet: notwendig."
        },

            frage: "Wenn Wissen nicht mehr aktuell ist, ist es ...",

            erklaerung: "„veraltet“ bedeutet: alt und nicht mehr aktuell."
        },
        {
            frage: "Eine neue berufliche Richtung nennt man ...",

            antworten: ["die Neuorientierung", "die Rechnung", "die Besprechung"],
            erklaerung: "„die Neuorientierung“ bedeutet: eine neue berufliche Richtung."
        },
        {
            frage: "Was bedeutet „die Herausforderung“?",
            richtig: "eine schwierige Aufgabe",
            antworten: ["eine schwierige Aufgabe", "eine Pause", "eine Rechnung"],
            erklaerung: "„die Herausforderung“ bedeutet: eine schwierige Aufgabe, die man lösen muss."
        },
        {
            frage: "„sorgfältig“ bedeutet ...",
            richtig: "genau und aufmerksam",
            antworten: ["genau und aufmerksam", "schnell und egal", "laut und stark"],
            erklaerung: "„sorgfältig“ bedeutet: genau, ordentlich und mit viel Aufmerksamkeit."
        }
    ],

    "Verben": [
        {
            frage: "Was passt? Eine Rechnung ...",
            richtig: "begleichen",
            antworten: ["begleichen", "abhalten", "erteilen"],
            erklaerung: "Bei „eine Rechnung“ passt: begleichen. Das bedeutet: bezahlen."
        },
        {
            frage: "Was passt? Einen Auftrag ...",
            richtig: "erteilen",
            antworten: ["erteilen", "beheben", "begleichen"],
            erklaerung: "Bei „einen Auftrag“ passt: erteilen."
        },
        {
            frage: "Was passt? Einen Fehler ...",
            richtig: "beheben",
            antworten: ["beheben", "abhalten", "einholen"],
            erklaerung: "Bei „einen Fehler“ passt: beheben. Das bedeutet: das Problem lösen."
        },
        {
            frage: "Was passt nicht? Einen Termin kann man ...",
            richtig: "einladen",
            antworten: ["bestätigen", "verschieben", "einladen"],
            erklaerung: "„einladen“ passt nicht zu „Termin“. Man lädt Personen ein. Einen Termin kann man bestätigen, verschieben, absagen oder vereinbaren."
        },
        {
            frage: "Was passt nicht? Eine technische Anlage kann man ...",
            richtig: "nähen",
            antworten: ["warten", "reparieren", "nähen"],
            erklaerung: "„nähen“ passt nicht. Man kann Kleidung oder Stoff nähen. Eine technische Anlage kann man warten oder reparieren."
        },
        {
            frage: "Was bedeutet „ein Angebot einholen“?",
            richtig: "ein Angebot anfordern",
            antworten: ["ein Angebot anfordern", "ein Angebot bezahlen", "ein Angebot reparieren"],
            erklaerung: "„ein Angebot einholen“ bedeutet: aktiv ein Angebot anfordern."
        },
        {
            frage: "Was passt? Eine Lieferung ...",
            richtig: "entgegennehmen",
            antworten: ["entgegennehmen", "erteilen", "beheben"],
            erklaerung: "Bei „eine Lieferung“ passt: entgegennehmen. Das bedeutet: die Lieferung annehmen, wenn sie kommt."
        },
        {
            frage: "Was passt? Eine Bestellung ...",
            richtig: "aufgeben",
            antworten: ["aufgeben", "feststellen", "abhalten"],
            erklaerung: "Bei „eine Bestellung“ passt: aufgeben. Das bedeutet: offiziell bestellen."
        }
    ],

    "Beschwerde schreiben": [
        {
            frage: "Welche Einleitung passt zu einer formellen Beschwerde?",
            richtig: "Hiermit möchte ich mich über die fehlerhafte Lieferung beschweren.",
            antworten: ["Hiermit möchte ich mich über die fehlerhafte Lieferung beschweren.", "Hallo, das war alles schlecht.", "Ich schreibe einfach mal."],
            erklaerung: "Eine Beschwerde muss höflich, klar und formell sein."

        {
            frage: "Welche Formulierung beschreibt das Problem formell?",
            richtig: "Leider mussten wir feststellen, dass mehrere Artikel fehlen.",
            antworten: ["Leider mussten wir feststellen, dass mehrere Artikel fehlen.", "Alles fehlt, das ist schlecht.", "Warum haben Sie das gemacht?"],
            erklaerung: "„Leider mussten wir feststellen, dass ...“ ist eine gute formelle Formulierung."
        },
        {
            frage: "Welche Forderung klingt höflich und passend?",
            richtig: "Ich bitte Sie, die fehlenden Artikel schnellstmöglich nachzuliefern.",
            antworten: ["Ich bitte Sie, die fehlenden Artikel schnellstmöglich nachzuliefern.", "Schicken Sie sofort alles!", "Machen Sie endlich Ihre Arbeit."],
            erklaerung: "Eine Forderung soll klar, aber höflich sein."
        },
        {
            frage: "Welcher Schluss passt zu einer Beschwerde?",
            richtig: "Ich bitte um eine zeitnahe Rückmeldung.",
            antworten: ["Ich bitte um eine zeitnahe Rückmeldung.", "Das war’s.", "Viele Grüße an alle im Forum."],
            erklaerung: "„Ich bitte um eine zeitnahe Rückmeldung“ passt gut in eine formelle Beschwerde."
        }
    ],

    "Antwort auf Beschwerde": [
        {
            frage: "Welche Einleitung passt als Antwort auf eine Beschwerde?",
            richtig: "Vielen Dank für Ihre Nachricht.",
            antworten: ["Vielen Dank für Ihre Nachricht.", "Das ist nicht unser Problem.", "Warum schreiben Sie uns?"],
            erklaerung: "Eine Antwort auf eine Beschwerde beginnt höflich und professionell."
        },
        {
            frage: "Welche Entschuldigung klingt formell?",
            richtig: "Wir bedauern die entstandenen Unannehmlichkeiten.",
            antworten: ["Wir bedauern die entstandenen Unannehmlichkeiten.", "Pech gehabt.", "Das passiert eben."],
            erklaerung: "„Wir bedauern ...“ ist eine gute formelle Entschuldigung."
        },
        {
            frage: "Welche Lösung passt zu fehlender Ware?",
            richtig: "Wir werden die fehlenden Artikel umgehend nachliefern.",
            antworten: ["Wir werden die fehlenden Artikel umgehend nachliefern.", "Sie müssen neu bestellen.", "Wir machen nichts."],
            erklaerung: "Bei fehlender Ware passt: nachliefern."
        },
        {
            frage: "Welcher Schluss passt in eine Antwort auf eine Beschwerde?",
            richtig: "Für Rückfragen stehen wir Ihnen gerne zur Verfügung.",
            antworten: ["Für Rückfragen stehen wir Ihnen gerne zur Verfügung.", "Bitte schreiben Sie nicht mehr.", "Ende."],
            erklaerung: "Dieser Satz ist höflich und typisch für formelle Geschäftskorrespondenz."
        }
    ],

    "Forumsbeitrag": [
        {
            frage: "Welche Formulierung passt zu einem Forumsbeitrag?",
            richtig: "Ich habe ähnliche Erfahrungen gemacht.",
            antworten: ["Ich habe ähnliche Erfahrungen gemacht.", "Sehr geehrte Damen und Herren,", "Hiermit kündige ich den Vertrag."],
            erklaerung: "Ein Forumsbeitrag ist persönlicher als ein formeller Brief."
        },
        {
            frage: "Wie beginnt man gut mit der eigenen Meinung?",
            richtig: "Meiner Meinung nach",
            antworten: ["Meiner Meinung nach", "Mit freundlichen Grüßen", "Hiermit beschwere ich mich"],
            erklaerung: "„Meiner Meinung nach“ passt gut zur Meinungsäußerung."
        },
        {
            frage: "Welche Formulierung nennt einen Vorteil?",
            richtig: "Ein großer Vorteil ist, dass ...",
            antworten: ["Ein großer Vorteil ist, dass ...", "Ich fordere Sie auf, ...", "Anbei sende ich Ihnen ..."],
            erklaerung: "In einem Forumsbeitrag muss man oft Vorteile und Nachteile nennen."
        },
        {
            frage: "Welche Formulierung nennt einen Nachteil?",
            richtig: "Ein Nachteil liegt darin, dass ...",
            antworten: ["Ein Nachteil liegt darin, dass ...", "Ich bitte um Nachlieferung.", "Sehr geehrter Herr Müller,"],
            erklaerung: "„Ein Nachteil liegt darin, dass ...“ ist gut für Diskussionen und Forumsbeiträge."
        }
    ]
};

function mischen(liste) {
    var kopie = liste.slice();
    for (var i = kopie.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = kopie[i];
        kopie[i] = kopie[j];
        kopie[j] = temp;
    }
    return kopie;
}

function zeigeMenu() {
    var box = document.getElementById("box");
    box.innerHTML =
        "<h1>Deutsch-B2-Trainer</h1>" +
        "<p class='klein'>Wähle, was du üben möchtest.</p>" +
        "<button class='menuButton' onclick=\"startKategorie('Wortschatz')\">1. Wortschatz</button>" +
        "<button class='menuButton' onclick=\"startKategorie('Verben')\">2. Verben</button>" +
        "<button class='menuButton' onclick=\"startKategorie('Beschwerde schreiben')\">3. Beschwerde schreiben</button>" +
        "<button class='menuButton' onclick=\"startKategorie('Antwort auf Beschwerde')\">4. Antwort auf Beschwerde</button>" +
        "<button class='menuButton' onclick=\"startKategorie('Forumsbeitrag')\">5. Forumsbeitrag</button>" +
        "<button class='menuButton' onclick=\"startGemischt()\">6. Gemischtes Training</button>";
}

function startKategorie(name) {
    aktuellerTitel = name;
    alleFragen = mischen(daten[name]);
    index = 0;
    punkte = 0;
    zeigeFrage();
}

function startGemischt() {
    aktuellerTitel = "Gemischtes Training";
    var gemischt = [];
    for (var kategorie in daten) {
        gemischt = gemischt.concat(daten[kategorie]);
    }
    alleFragen = mischen(gemischt);
    index = 0;
    punkte = 0;
    zeigeFrage();
}

function zeigeFrage() {
    beantwortet = false;
    var f = alleFragen[index];
    var antworten = mischen(f.antworten);

    var html =
        "<h1>Deutsch-B2-Trainer</h1>" +
        "<p class='klein'>" + aktuellerTitel + "</p>" +
        "<div class='info'>Punkte: <span id='punkte'>" + punkte + "</span> | Frage: " + (index + 1) + "/" + alleFragen.length + "</div>" +
        "<div class='frage'>" + f.frage + "</div>" +
        "<div id='antworten'></div>" +
        "<div class='meldung' id='meldung' style='display:none;'></div>" +
        "<button onclick='weiter()' id='weiterButton' style='display:none;'>Weiter</button>" +
        "<button class='zurueck' onclick='zeigeMenu()'>Zurück zum Menü</button>";

    document.getElementById("box").innerHTML = html;

    var div = document.getElementById("antworten");
    for (var i = 0; i < antworten.length; i++) {
        var b = document.createElement("button");
        b.innerText = antworten[i];
        b.onclick = function() {
            pruefen(this);
        };
        div.appendChild(b);
    }
}

function findeInfo(antwort) {
    if (info[antwort]) {
        return info[antwort];
    }
    return "Diese Antwort passt hier nicht so gut. Achte auf die typische Verbindung und den Kontext.";
}

function pruefen(button) {
    if (beantwortet) return;
    beantwortet = true;

    var f = alleFragen[index];
    var richtigeAntwort = f.richtig;
    var gewaehlteAntwort = button.innerText;
    var alleButtons = document.querySelectorAll("#antworten button");

    for (var i = 0; i < alleButtons.length; i++) {
        if (alleButtons[i].innerText === richtigeAntwort) {
            alleButtons[i].className = "richtig";
        }
    }

    var meldung = document.getElementById("meldung");
    meldung.style.display = "block";

    if (gewaehlteAntwort === richtigeAntwort) {
        punkte++;
        meldung.innerHTML =
            "<b>Richtig!</b><br><br>" +
            f.erklaerung;
    } else {
        button.className = "falsch";
        meldung.innerHTML =
            "<b>Nicht richtig.</b><br><br>" +
            "<b>Warum?</b><br>" +
            f.erklaerung + "<br><br>" +
            "<b>Deine Antwort war:</b> " + gewaehlteAntwort + "<br>" +
            findeInfo(gewaehlteAntwort) + "<br><br>" +
            "<b>Merke:</b> Richtig ist: <b>" + richtigeAntwort + "</b>.";
    }

    document.getElementById("weiterButton").style.display = "block";
}

function weiter() {
    index++;
    if (index >= alleFragen.length) {
        document.getElementById("box").innerHTML =
            "<h1>Fertig!</h1>" +
            "<p class='klein'>" + aktuellerTitel + "</p>" +
            "<div class='frage'>Du hast " + punkte + " von " + alleFragen.length + " Punkten erreicht.</div>" +
            "<button onclick='startKategorie(aktuellerTitel)'>Noch einmal diese Kategorie spielen</button>" +
            "<button onclick='zeigeMenu()'>Zurück zum Menü</button>";
    } else {
        zeigeFrage();
    }
}

zeigeMenu();
</script>

</body>
</html>
